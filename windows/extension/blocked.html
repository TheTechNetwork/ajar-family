<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blocked</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --ink: #1c1e21;
      --muted: #5b6270;
      --line: #e3e6ea;
      --accent: #2f6feb;
      --accent-ink: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --card: #1d2026;
        --ink: #eef0f3;
        --muted: #a0a7b4;
        --line: #2b2f37;
        --accent: #4c86ff;
        --accent-ink: #0b0d10;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink);
      font: 16px/1.5 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
      padding: 24px;
    }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      max-width: 520px; width: 100%; padding: 32px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 12px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #e2554e; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 16px; }
    .target {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px; word-break: break-all; background: rgba(127,127,127,.10);
      border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0 0 20px;
    }
    .reason { font-size: 13px; color: var(--muted); margin: -8px 0 20px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
    textarea {
      width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--line);
      border-radius: 8px; padding: 10px 12px; font: inherit; background: var(--bg); color: var(--ink);
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 18px; cursor: pointer;
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
    }
    button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    button:disabled { opacity: .55; cursor: default; }
    .status { font-size: 13px; margin-top: 14px; min-height: 18px; }
    .ok { color: #2c9c62; }
    .err { color: #e2554e; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span> Blocked by Family Filter</div>
    <h1>This page isn't available right now</h1>
    <p>A parent set up filtering on this computer. You can ask a parent to allow this.</p>

    <div class="target" id="target">(loading…)</div>
    <div class="reason" id="reason"></div>

    <label for="note">Add a note for your parent (optional)</label>
    <textarea id="note" placeholder="Why do you want to watch this?"></textarea>

    <div class="row">
      <button class="primary" id="request">Request Access</button>
      <button id="back">Go Back</button>
    </div>
    <div class="status" id="status"></div>
  </main>

  <!-- Inline script is CSP-permitted for extension pages under MV3 (the extension
       origin), unlike remote pages. Kept minimal. -->
  <script src="blocked.js"></script>
</body>
</html>
