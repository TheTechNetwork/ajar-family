# XcodeGen definition for PoC D (docs/APPLE_URL_FILTER_POC.md).
#
#   brew install xcodegen && xcodegen generate
#
# The URL-filter control provider is an ExtensionKit app extension
# (EXExtensionPointIdentifier), NOT a classic NSExtension plug-in and NOT a
# system extension — NEURLFilterControlProvider refines ExtensionFoundation's
# AppExtension protocol. See ADR-013.
#
# Build the Bloom artifacts before generating, so they get bundled:
#   python3 tools/build-bloom/build_bloom.py Resources/blocklist.txt \
#       --out-dir Resources/out

name: URLFilterPoC
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # See AjarFilter/project.yml for why this is here and not accepted
    # in Xcode's "Validate Project Settings" dialog.
    DEAD_CODE_STRIPPING: "YES"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:

  URLFilterPoC:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: URLFilterControlProviderExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.URLFilterPoC
        CODE_SIGN_ENTITLEMENTS: App/URLFilterPoC.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: URLFilter PoC
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # ExtensionKit app extension implementing NEURLFilterControlProvider.
  # Ships the offline-built Bloom prefilter as bundle resources.
  URLFilterControlProviderExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: URLFilterControlProviderExtension
      - path: Resources/out/bloom.bin
        buildPhase: resources
        optional: true
      - path: Resources/out/bloom.meta.json
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.URLFilterPoC.URLFilterControlProviderExtension
        CODE_SIGN_ENTITLEMENTS: URLFilterControlProviderExtension/URLFilterControlProviderExtension.entitlements
    info:
      path: URLFilterControlProviderExtension/Info.plist
      properties:
        CFBundleDisplayName: URLFilter Control Provider
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.networkextension.url-filter-control

schemes:
  URLFilterPoC:
    build:
      targets:
        URLFilterPoC: all
    run:
      config: Debug
