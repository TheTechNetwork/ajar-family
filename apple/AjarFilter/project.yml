# XcodeGen definition for AJAR FILTER — the app installed on the device being
# filtered. One product across iOS, iPadOS and macOS, one bundle id, one App
# Store Connect record.
#
# NAMING. This was `child` until it became a real product. "Filter" describes
# what the app IS rather than who it is for: the same binary protects a phone, an
# iPad and a Mac, and on a shared family Mac "the child app" is simply the wrong
# noun. The parent-facing app is AjarParent (../AjarParent).
#
# WHAT IS PROVEN. The iOS target below is the configuration measured working on
# an iPhone 16 Pro Max / iOS 27.0 (docs/DECISIONS.md ADR-001, A1-A3): per-video
# enforcement, the block page, and the two content-filter extensions. It has not
# been changed except for the rename.
#
# WHAT IS NOT. The macOS destination is NEW and has not been generated, built or
# run — see the macOS note on the AjarFilter target.
#
#   brew install xcodegen && xcodegen generate
#
# Signing: pass your team on the command line or set it in Xcode, e.g.
#   xcodebuild -project AjarFilter.xcodeproj -scheme AjarFilter \
#     -destination 'generic/platform=iOS' DEVELOPMENT_TEAM=ABCDE12345 build
# The Family Controls + Network Extension entitlements require a real team;
# a compile/link-only check can use CODE_SIGNING_ALLOWED=NO.

name: AjarFilter
options:
  bundleIdPrefix: family.ajar
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Supplied at build time (xcodebuild DEVELOPMENT_TEAM=... or Xcode UI).
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Defaults. CI overrides CURRENT_PROJECT_VERSION on the xcodebuild command
    # line with the next build number App Store Connect will accept; the
    # Info.plist entries below interpolate these rather than hardcoding, or the
    # override silently does nothing (see the comment on CFBundleVersion).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:

  AjarFilter:
    type: application
    # One target, several destinations: iOS and iPadOS come from the iOS
    # destination (TARGETED_DEVICE_FAMILY "1,2"), macOS is the third. A single
    # target means a single PRODUCT_BUNDLE_IDENTIFIER, which is what keeps this
    # to one App Store Connect record instead of two apps that drift.
    #
    # ⚠️ UNVERIFIED ON macOS. Generated, built and run only for iOS so far.
    # The known obstacle is not this file: on macOS a content filter must ship as
    # a SYSTEM extension (com.apple.developer.system-extension.install on the
    # installing app, Developer ID signing + notarization outside the App Store),
    # whereas the two targets below are iOS APP extensions. So a macOS build of
    # this target produces the app shell WITHOUT filtering until that separate
    # extension exists. Do not read a successful macOS compile as a working
    # filter — that distinction is exactly what the Simulator already taught us
    # (docs/DECISIONS.md: loadFromPreferences succeeds against an unbacked stub).
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      - path: Shared          # compiled into every target (no embedded framework)
    dependencies:
      - target: FilterDataProvider
      - target: FilterControlProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.ajar.filter
        CODE_SIGN_ENTITLEMENTS: App/AjarFilter.entitlements
        # Manual signing in CI (docs/APPLE_ACCOUNT_SETUP.md §3.1, §5). Each
        # target reads a DIFFERENT variable because a build setting passed on
        # the xcodebuild command line applies to every target at once — one
        # shared name would sign all three with the app's profile. Empty under
        # local automatic signing, where Xcode ignores it.
        PROVISIONING_PROFILE_SPECIFIER: $(AJAR_PROFILE_APP)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # App Store validation refuses an upload without an icon, with two
        # separate errors: "Missing required icon files" and "Missing Info.plist
        # CFBundleIconName". Naming the icon set here fixes BOTH — the asset
        # catalog compiler emits the icon assets and writes CFBundleIconName into
        # the built Info.plist, which is not a key you add by hand.
        # A single 1024x1024 opaque PNG is sufficient on modern Xcode; an icon
        # with an alpha channel is rejected, so App/Assets.xcassets holds a
        # flattened one.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ParentFilter PoC
        # XcodeGen writes a LITERAL CFBundleVersion of "1" when this is not set,
        # so passing CURRENT_PROJECT_VERSION=N to xcodebuild changed a build
        # setting nothing referenced. CI archived and exported happily and then
        # the upload was rejected:
        #   The bundle version must be higher than the previously uploaded
        #   version: '1'
        # — with the correct number sitting in a variable one layer away. These
        # two keys must interpolate the settings, not restate their values.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Export compliance, answered ONCE here instead of per upload. Apple only
        # requires documentation for non-exempt encryption; encryption built into
        # the OS (HTTPS via URLSession, CryptoKit) is exempt, and that is all this
        # app uses — TLS to the backend plus Ed25519 snapshot verification through
        # CryptoKit. Without this key every single TestFlight upload parks in App
        # Store Connect waiting for a human to answer the encryption questions,
        # which is exactly the manual gate CI exists to remove.
        # Re-confirm this if a third-party crypto library is ever linked.
        # https://developer.apple.com/documentation/bundleresources/information-property-list/itsappusesnonexemptencryption
        ITSAppUsesNonExemptEncryption: false
        # How the Request-Access block page hands back to the app. The page is
        # served over https (NEFilterProvider requires an http/https remediation
        # URL, so the block page itself CANNOT be a custom scheme), and its
        # button links to ajar://request?u=… — the app then files the request
        # with its device token. Universal Links would avoid the scheme entirely
        # and are the right end state, but they need an apple-app-site-association
        # on blocked.ajar.family plus the Associated Domains capability; this
        # works today and does not gate the flow on DNS.
        CFBundleURLTypes:
          - CFBundleURLName: family.ajar.filter
            CFBundleURLSchemes:
              - ajar
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Content filter DATA provider — sees every flow, returns allow/drop/remediate.
  # iOS ONLY, deliberately: the macOS equivalent is a system extension with a
  # different container, entitlement and distribution channel (see AjarFilter).
  FilterDataProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: FilterDataProvider
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.ajar.filter.DataProvider
        CODE_SIGN_ENTITLEMENTS: FilterDataProvider/FilterDataProvider.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(AJAR_PROFILE_DATA)
    info:
      path: FilterDataProvider/Info.plist
      properties:
        CFBundleDisplayName: ParentFilter Data Provider
        # Must match the host app exactly or App Store validation refuses the
        # bundle; same interpolation as the app for the same reason.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.filter-data
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FilterDataProvider

  # Content filter CONTROL provider — owns remediationMap + notifyRulesChanged().
  # iOS only, for the same reason as the data provider above.
  FilterControlProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: FilterControlProvider
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.ajar.filter.ControlProvider
        CODE_SIGN_ENTITLEMENTS: FilterControlProvider/FilterControlProvider.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(AJAR_PROFILE_CONTROL)
    info:
      path: FilterControlProvider/Info.plist
      properties:
        CFBundleDisplayName: ParentFilter Control Provider
        # Must match the host app exactly or App Store validation refuses the
        # bundle; same interpolation as the app for the same reason.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.filter-control
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FilterControlProvider

schemes:
  AjarFilter:
    build:
      targets:
        AjarFilter: all
    run:
      config: Debug
