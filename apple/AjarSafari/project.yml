# XcodeGen definition for AJAR FOR SAFARI ON macOS.
#
# WHAT THIS IS NOW. The Safari Web Extension itself lives at
# apple/SafariExtension/ and ships INSIDE the iOS app (apple/AjarFilter) — one
# app, one enrolment, one device identity. macOS cannot do that: there is no
# FamilyControls there and the content filter would have to be a system
# extension with a different container, entitlement and distribution channel. So
# this project is the macOS-only container for the SAME extension sources. Two
# hosts, one copy of the extension.
#
# WHY IT EXISTS AT ALL (docs/DECISIONS.md ADR-018). `NEFilterDataProvider` is
# asked once per FLOW. A top-level navigation arrives as a browser flow carrying
# the full URL and is enforced per-URL; everything a page fetches for itself
# arrives as a socket flow carrying a hostname and nothing else. So inside any
# single-page app — Reddit, X, Instagram, TikTok, Google Search, YouTube — the
# content filter enforces at HOST level. That is not URL filtering.
#
# Inspecting flow data does not rescue it: those bytes are TLS ciphertext, and
# reading them needs TLS interception, which this architecture rules out
# unconditionally on Apple. A Safari Web Extension sees each request, and it
# decides LOCALLY against the cached signed snapshot — no per-request network
# call, which is the on-device requirement rather than a trade against it.
#
#   brew install xcodegen && xcodegen generate
#
# RE-RUN IT AFTER EVERY PULL THAT TOUCHES THIS FOLDER OR ../SafariExtension. The
# .xcodeproj is generated and gitignored, so it does NOT update when you pull —
# it keeps whatever file list it had when you last generated it. A source file
# added upstream is simply absent from the target, and Swift reports that as
# "cannot find <symbol> in scope" at every USE site rather than as a missing
# file. CI cannot catch this for you: it runs `xcodegen generate` on a clean
# checkout every time. Close the project in Xcode before regenerating.

name: AjarSafari
options:
  bundleIdPrefix: family.ajar
  deploymentTarget:
    # macOS only here — the iOS build of this extension is a target in
    # apple/AjarFilter. Matched to the rest of the product rather than reaching
    # for the Safari-Web-Extension floor.
    macOS: "26.0"
  createIntermediateGroups: true

# Named explicitly rather than inherited from XcodeGen's presets, for the same
# reason AjarFilter does it: a Release build that still defined DEBUG would ship
# development behaviour, and the guarantee should be readable in the file.
configs:
  Debug: debug
  Release: release

settings:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      GCC_PREPROCESSOR_DEFINITIONS: "$(inherited)"
  base:
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:

  # The container. A Safari Web Extension cannot be installed on its own — it
  # ships inside an app, and on iOS that app is the only place a parent can be
  # told to go and switch it on.
  AjarSafari:
    type: application
    supportedDestinations: [macOS]
    sources:
      # The entitlements file is named by CODE_SIGN_ENTITLEMENTS below; listing
      # it as a source too would only risk it being copied INTO the bundle.
      - path: App
        excludes: ["*.entitlements"]
      # Same instructions the iOS host shows, from one file.
      - path: ../SafariExtension/UI
    dependencies:
      - target: AjarSafariExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.ajar.safari
        PROVISIONING_PROFILE_SPECIFIER: $(AJAR_PROFILE_SAFARI_APP)
        CODE_SIGN_ENTITLEMENTS: App/AjarSafari.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ajar for Safari
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Answered once here rather than per upload: the only encryption is the
        # OS's own (HTTPS via URLSession, CryptoKit), which is exempt.
        ITSAppUsesNonExemptEncryption: false

  # The extension. The SAME sources the iOS app compiles (apple/AjarFilter's
  # SafariExtension target) — referenced, not copied, so the two hosts cannot
  # drift. ../AjarFilter/Shared comes along because the native shim reads policy
  # through PolicyStore rather than keeping its own copy of the App Group name
  # and storage keys.
  AjarSafariExtension:
    type: app-extension
    supportedDestinations: [macOS]
    sources:
      - path: ../SafariExtension/ExtensionShim
        excludes: ["*.entitlements"]
      # The MV3 resources, copied in whole rather than listed file by file — a
      # new .js added to the extension must not need a project edit to ship.
      - path: ../SafariExtension/Extension
        type: folder
        buildPhase: resources
      - path: ../AjarFilter/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.ajar.safari.Extension
        PROVISIONING_PROFILE_SPECIFIER: $(AJAR_PROFILE_SAFARI_EXT)
        CODE_SIGN_ENTITLEMENTS: ../SafariExtension/ExtensionShim/SafariExtension.entitlements
    info:
      path: ../SafariExtension/ExtensionShim/Info.plist
      properties:
        CFBundleDisplayName: Ajar
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler

schemes:
  AjarSafari:
    build:
      targets:
        AjarSafari: all
    run:
      config: Debug
