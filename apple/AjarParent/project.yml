# XcodeGen definition for AJAR PARENT — the app a parent approves from.
#
#   brew install xcodegen && xcodegen generate
#
# RE-RUN IT AFTER EVERY PULL THAT TOUCHES THIS FOLDER. The .xcodeproj is
# generated and gitignored, so it does NOT update when you pull — it keeps
# whatever file list it had when you last generated it. A source file added
# upstream is simply absent from the target, and Swift reports that as
# "cannot find <symbol> in scope" at every USE site rather than as a missing
# file. A new Theme.swift, for instance, produces dozens of "cannot find
# 'Ajar' in scope" and nothing pointing at the actual cause.
#
# CI cannot catch this for you: it runs `xcodegen generate` on a clean
# checkout every time, so it is never building a stale project.
# Close the project in Xcode before regenerating, or it will not be reloaded.
#
# One product across iOS, iPadOS and macOS, one bundle id, one App Store Connect
# record — the same universal shape as AjarFilter (../AjarFilter).
#
# This app enforces nothing. It signs in, watches the pending-request feed, and
# posts a decision; all policy lives server-side and reaches devices as a signed
# snapshot. That is why its entitlements are almost empty next to the filter's.
#
# ⚠️ NOT YET BUILT. Written against backend/openapi.json rather than compiled —
# there is no Xcode here. The first `xcodegen generate` + build is expected to
# surface real errors; treat that as the point, not as a regression.

name: AjarParent
options:
  bundleIdPrefix: family.ajar
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # See AjarFilter/project.yml for why this is here and not accepted
    # in Xcode's "Validate Project Settings" dialog.
    DEAD_CODE_STRIPPING: "YES"
    # Defaults; CI overrides CURRENT_PROJECT_VERSION on the xcodebuild command
    # line with the next build number App Store Connect will accept. Ported from
    # AjarFilter, where it was learned by rejection rather than by design:
    # XcodeGen writes a LITERAL CFBundleVersion of "1" when this is unset, so
    # passing CURRENT_PROJECT_VERSION=N changed a build setting nothing
    # referenced — CI archived and exported happily and the upload was refused
    # with "The bundle version must be higher than the previously uploaded
    # version: '1'", the correct number sitting one layer away in a variable.
    # The Info.plist keys below must INTERPOLATE these, not restate their values.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:

  AjarParent:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.ajar.parent
        CODE_SIGN_ENTITLEMENTS: App/AjarParent.entitlements
        # See the note in ../AjarFilter/project.yml: each target reads a
        # DIFFERENT variable, because a build setting passed on the xcodebuild
        # command line applies to every target at once.
        PROVISIONING_PROFILE_SPECIFIER: $(AJAR_PROFILE_PARENT)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ajar Parent
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Answered once here instead of on every upload. Same basis as the
        # filter app: only OS-provided encryption (TLS via URLSession, Keychain).
        # Re-confirm if a third-party crypto library is ever linked.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  AjarParent:
    build:
      targets:
        AjarParent: all
    run:
      config: Debug
