# Cloudflare Workers deploy config for the backend.
# Deploy: from backend/, `npm run build` then `wrangler deploy`.
# Secrets (never in git): set with `wrangler secret put <NAME>`:
#   AUTH_SECRET, SIGNING_PUBLIC_KEY_B64, SIGNING_PRIVATE_KEY_B64
# ...or, preferred, set them as GitHub repository secrets and let the deploy
# workflow sync them (.github/workflows/deploy.yml) so GitHub is the one place
# they are managed and nobody needs a local wrangler login.
# See docs/DEPLOYMENT.md for generating the Ed25519 keypair and CI wiring.
name = "ajar-backend"
main = "dist/worker.js"
compatibility_date = "2026-08-01"

# The Worker uses node:crypto (randomUUID) and Buffer via the Node compat layer.
# Ed25519 signing uses WebCrypto, which Workers supports natively.
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# PERSISTENCE. This binding is NOT optional for a real deployment.
#
# Without it the Worker falls back to a per-isolate in-memory store: it starts
# fine, serves traffic, and silently loses every family, device and approval
# whenever the isolate recycles. That failure looks like "the app randomly signs
# me out and forgets my kids", which is worse than not deploying at all — so the
# binding is committed rather than left commented out for someone to remember.
#
# The schema is created on first use (IF NOT EXISTS) and MIGRATIONS_SQL brings an
# older database forward, so there is no separate migrate step.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "ajar-alpha"
database_id = "df4b4ce0-0895-4b8a-864c-62a589240e25"

# ---------------------------------------------------------------------------
# CUSTOM DOMAIN for the Request-Access block page.
#
# iOS renders `https://blocked.ajar.family/blocked?u=<flow url>` inside the
# content filter's remediation view when a flow is blocked, so this hostname is
# load-bearing for the whole request flow: if it does not resolve, the block
# page still appears but "Ask a parent" goes nowhere. That is exactly the state
# the PoC was in while the URL pointed at the reserved `parentfilter.example`.
#
# `custom_domain = true` makes Wrangler create and manage the DNS record itself,
# so there is no separate record to add by hand and no chance of the two drifting.
# It requires the ajar.family ZONE to be in the same Cloudflare account as the
# Worker; if it is not, `wrangler deploy` fails here with a zone-lookup error
# rather than silently deploying without the hostname.
#
# The two hostnames are deliberately NOT interchangeable. A custom domain would
# otherwise take every path on both, leaving the auth and policy surface
# answering on the one origin that is permanently pinned into shipped iOS builds
# and fetched unauthenticated while a filter is blocking. worker.ts refuses
# everything but /blocked on `blocked.*`; the API lives on `api.*`, which is
# where BackendClient.baseURL points.
#
# ORDER MATTERS, and not only cosmetically. `wrangler dev` / `unstable_dev`
# simulates the FIRST route's hostname inside the Worker, so whichever pattern
# leads is the host that local runs and the workerd test suite see. The API has
# to lead, or every local request arrives as `blocked.*` and is refused by the
# single-purpose guard in worker.ts — which is exactly what happened when this
# list was the other way round.
[[routes]]
pattern = "api.ajar.family"
custom_domain = true

# `blocked` has ONE job and the Worker enforces it: every path other than
# /blocked is refused on this hostname (see worker.ts). It is baked into shipped
# builds through `remediationMap`, so it is the hardest hostname in the system to
# ever change — keeping it single-purpose is what stops the API's surface from
# being pinned to it by accident.
[[routes]]
pattern = "blocked.ajar.family"
custom_domain = true

# ---------------------------------------------------------------------------
# THE HUMAN HOSTNAME. Without this route ajar.family resolves to nothing: the
# site, the signup flow and the console were reachable only at api.ajar.family,
# which is the hostname devices talk to and not one any parent would type.
#
# www redirects to the apex in worker.ts rather than serving alongside it, and
# that is a correctness requirement, not tidiness. Signing up writes tokens to
# localStorage, which is per-ORIGIN: sign up on www, come back later to the
# apex, and the console finds an empty store and shows a login screen. Two
# hostnames that both work are exactly how that happens, so only one does.
[[routes]]
pattern = "ajar.family"
custom_domain = true

[[routes]]
pattern = "www.ajar.family"
custom_domain = true

# ---------------------------------------------------------------------------
# Links inside the emails the backend sends. Not secrets — they are public URLs
# — so they belong here rather than in `wrangler secret put`.
#
# Both point at the apex, the same origin the parent signed up on, for the
# localStorage reason above. `/parent/` specifically because the console is what
# reads `?verify=` out of the URL (web/parent/app.js).
#
# Unset, nothing breaks loudly: the confirmation email still carries the code and
# simply has no link to click, and the console's ?verify= handler is never
# reached. That is a quiet downgrade of the flow that now gates account creation,
# which is why these are committed rather than left to be remembered.
[vars]
# The confirmation link resumes the guided setup rather than dropping a brand-new
# parent into an empty console. /v1/auth/verify returns tokens when the code
# completes a sign-up, so signup.html can carry straight on to "name your
# family"; when it is an EXISTING account confirming itself there is nothing to
# set up and the page forwards to /parent/ instead.
VERIFY_EMAIL_URL = "https://ajar.family/signup.html"
PASSWORD_RESET_URL = "https://ajar.family/parent/"
# The From address on every message Ajar sends. `app.ajar.family` is the
# subdomain actually onboarded to Email Service; the apex is NOT, and this said
# `no-reply@ajar.family` until a live signup proved it. A sender whose domain is
# not onboarded fails per-send with E_SENDER_NOT_VERIFIED — never at startup — so
# the first symptom is a parent waiting for a code that was never sent.
#
# Change this only alongside Email > Domains in the dashboard. The two have to
# agree and nothing in CI can check that they do.
MAIL_FROM = "noreply@app.ajar.family"

# WebAuthn relying-party identity — the second factor on every parent account.
#
# THESE TWO ARE NOT INTERCHANGEABLE WITH ANY OTHER HOSTNAME AND CANNOT BE
# CHANGED LATER. A passkey is bound by the browser to the rpId it was created
# under; change it and every enrolled passkey silently stops working, with no
# migration and no way for a parent to recover except support. That is also why
# they are pinned to the APEX: the console is served there, www 301s to it, and
# a ceremony run on a page whose origin is not `ajar.family` is refused by the
# browser before it reaches us.
#
# Unset, the backend falls back to localhost — which is correct for `npm run
# dev` and silently wrong in production: the browser would refuse every
# ceremony, and it would read as "passkeys are broken" rather than as a missing
# variable. So they are committed rather than left to be remembered.
PASSKEY_RP_ID = "ajar.family"
PASSKEY_ORIGIN = "https://ajar.family"
# Shown inside the platform's own "Save a passkey for …" prompt.
PASSKEY_RP_NAME = "Ajar"

# Which native apps may use the passkeys enrolled against PASSKEY_RP_ID, as
# `<TeamID>.<bundle id>`, comma separated. This is what the router serves at
# /.well-known/apple-app-site-association, and without it the parent iOS/macOS
# app cannot complete a passkey sign-in — which, because sign-in is
# password-then-passkey, means it cannot sign in at all.
#
# Commented out rather than set to a placeholder: a WRONG team id is worse than
# a missing one. The route 404s while this is unset, and Apple retries a 404;
# it does not retry a file that positively lists the wrong app.
#
# Fill in the real Team ID (docs/APPLE_ACCOUNT_SETUP.md §1) and redeploy:
# APPLE_APP_IDS = "ABCDE12345.family.ajar.parent"

# ---------------------------------------------------------------------------
# EMAIL. Cloudflare Email Sending, called as env.EMAIL.send() from worker.ts.
#
# This replaces posting to a third-party provider with MAIL_TOKEN, and the
# reason is not convenience. MAIL_TOKEN is a long-lived bearer credential held
# by a company that can read every subject line we send — and every subject
# line here is about a specific child. The binding has no token: it is
# authorised by being bound, so there is nothing to leak and nothing to rotate.
#
# NO destination restriction on purpose. `destination_address` and
# `allowed_destination_addresses` exist and are right for a Worker that alerts
# its own operator; this one emails whichever parent signed up, so an allowlist
# would silently deliver to nobody. The SENDER is what is constrained, by
# Email Service requiring the domain to be onboarded.
#
# Requires the Workers PAID plan (Email Sending, public beta since 2026-04-16).
# `wrangler dev` SIMULATES this binding — it logs the message and writes the body
# to a temp file rather than sending — so a green local run proves the call shape
# and nothing about deliverability. Add `remote = true` to send for real.
[[send_email]]
name = "EMAIL"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# STATIC ASSETS — the marketing site, the signup flow and the parent console.
#
# WHY THEY LIVE IN THIS WORKER AND NOT ON THEIR OWN HOST. `web/site/signup.js`
# writes the localStorage keys `web/parent/app.js` reads (cf_access, cf_refresh,
# cf_family), which is how "Go to your console" lands a parent already signed in.
# localStorage is per-ORIGIN. Put the site on a second hostname and that handoff
# breaks silently: a parent finishes signing up and is shown a login screen. One
# Worker, one origin, and the API is already on it — so nothing about the browser
# session has to be redesigned and no DNS record has to be added.
#
# `directory` is relative to THIS FILE, so `../web` is the repo's web/ folder
# uploaded whole: web/site/* lands at /site/* and web/parent/* at /parent/*.
# worker.ts maps the public paths onto that layout (/ -> /site/index.html), which
# is why /site/... is not itself reachable — it maps to /site/site/..., a miss.
#
# run_worker_first = true IS THE SECURITY-RELEVANT LINE, not a preference.
# Assets are served BEFORE Worker code by default, and asset routing knows
# nothing about hostnames — so with the default, `blocked.ajar.family/` would
# hand out the home page and `blocked.ajar.family/parent/app.js` the console,
# straight past the single-purpose guard in worker.ts. That guard is the reason
# the API's surface is not pinned to the one hostname shipped iOS builds bake in.
# Running the Worker first keeps it the only router: it checks the host, then
# asks for an asset through the ASSETS binding. Delete this line and the guard
# stops applying to everything except /v1.
#
# html_handling = "none" because the public path and the stored path differ. Any
# other value lets the asset router issue its own redirects, which would send a
# browser to the INTERNAL path — /site/... — and that path 404s by design.
# not_found_handling = "none" so a miss comes back 404 and worker.ts can fall
# through to the API router (that is how /blocked and the JSON 404 still work);
# "single-page-application" would swallow both by answering 200 index.html.
[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"
