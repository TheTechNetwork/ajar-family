# Local dev Postgres for the durable-store path (Phase 1 hardening).
# The alpha runs on the in-memory store and does not require this; it's here so
# the Postgres-backed Repository implementation (follow-up) has a target.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ajar
      POSTGRES_PASSWORD: ajar
      POSTGRES_DB: ajar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
