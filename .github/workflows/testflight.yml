name: iOS — TestFlight (internal)

# Archives the iOS child app and uploads it to TestFlight for INTERNAL testing.
#
# READ THIS BEFORE EXPECTING IT TO WORK. This workflow is correct, but it cannot
# succeed until three things outside CI are true, and two of them take real
# calendar time:
#
#  1. FAMILY CONTROLS IS A RESTRICTED ENTITLEMENT. `com.apple.developer.family-controls`
#     must be granted to the team by Apple before a distribution build can sign.
#     Development signing works without it; TestFlight does not. Request it and
#     wait — this is the long pole, not the pipeline.
#  2. THE BUNDLE IDS MUST BE REGISTERED. They are hardcoded in project.yml
#     (family.ajar.child and its two extensions, App Group group.family.ajar.child).
#     Register all three App IDs plus the App Group in the developer account,
#     with Family Controls, Network Extensions and App Groups enabled.
#  3. AN APP STORE CONNECT RECORD for that bundle id, or the upload has nowhere
#     to land.
#
# It also builds an app whose enforcement has NEVER been verified on hardware
# (ADR-012). Shipping it to internal testers is exactly how that gets verified —
# just do not read a green run here as "the filter works".

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "testflight" to upload a build'
        required: true
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.confirm == 'testflight'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SCHEME: ParentFilterPoC
      PROJECT_DIR: apple/poc-contentfilter
      # The bundle ids are HARDCODED in project.yml, not injected here: they are
      # permanent, public, and identical for every build, so rewriting generated
      # files in CI only created a way for a local build and a CI build to sign
      # as different apps. The team id stays a variable — it is the one value
      # that legitimately differs between whoever is building.
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      # Fail with a readable list rather than a signing error 20 minutes in.
      - name: Preflight — the account settings this cannot run without
        run: |
          missing=""
          [ -n "${TEAM_ID:-}" ]   || missing="$missing APPLE_TEAM_ID(var)"
          [ -n "${{ secrets.ASC_KEY_ID }}" ]     || missing="$missing ASC_KEY_ID(secret)"
          [ -n "${{ secrets.ASC_ISSUER_ID }}" ]  || missing="$missing ASC_ISSUER_ID(secret)"
          [ -n "${{ secrets.ASC_KEY_P8 }}" ]     || missing="$missing ASC_KEY_P8(secret)"
          [ -n "${{ secrets.APPLE_DIST_P12 }}" ]          || missing="$missing APPLE_DIST_P12(secret)"
          [ -n "${{ secrets.APPLE_DIST_P12_PASSWORD }}" ] || missing="$missing APPLE_DIST_P12_PASSWORD(secret)"
          [ -n "${{ secrets.APPLE_PROFILE_APP }}" ]       || missing="$missing APPLE_PROFILE_APP(secret)"
          [ -n "${{ secrets.APPLE_PROFILE_DATA }}" ]      || missing="$missing APPLE_PROFILE_DATA(secret)"
          [ -n "${{ secrets.APPLE_PROFILE_CONTROL }}" ]   || missing="$missing APPLE_PROFILE_CONTROL(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing"
            echo "See docs/APPLE_ACCOUNT_SETUP.md §3.1 and §5. Signing is MANUAL: the"
            echo "distribution certificate (.p12) and one provisioning profile per target"
            echo "are created by hand and supplied as base64 secrets. The App Store Connect"
            echo "API key is still needed — it authenticates the upload."
            exit 1
          fi

      # App Store Connect REFUSES any build made with an SDK older than iOS 26,
      # and it refuses it at upload — after a full archive and export have
      # succeeded:
      #   SDK version issue. This app was built with the iOS 18.5 SDK.
      # The runner image ships several Xcodes and the default is not always the
      # newest, so pick explicitly and fail here, loudly, rather than 15 minutes
      # later at Apple. Note the project's deployment target is already iOS 26.0
      # and xcodebuild still archived against the 18.5 SDK without complaint,
      # which is precisely why this needs asserting rather than assuming.
      - name: Select an Xcode with the iOS 26 SDK or newer
        run: |
          set -euo pipefail
          best=""; best_v=0
          for app in /Applications/Xcode*.app; do
            [ -e "$app" ] || continue
            v="$(/usr/bin/defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)"
            major="${v%%.*}"
            case "$major" in ''|*[!0-9]*) continue ;; esac
            if [ "$major" -ge 26 ] && [ "$major" -gt "$best_v" ]; then best="$app"; best_v="$major"; fi
          done
          if [ -z "$best" ]; then
            echo "::error::No Xcode 26+ on this runner. Available:"
            for app in /Applications/Xcode*.app; do
              echo "  $app $(/usr/bin/defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo '?')"
            done
            exit 1
          fi
          sudo xcode-select -s "$best/Contents/Developer"
          echo "using $best"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is generated, not committed — project.yml is the source of
      # truth, so there is no stale project file to drift from the sources.
      - name: Generate the Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate

      # The API key authenticates BOTH the signing-profile creation below and the
      # upload at the end, so it is written once here.
      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # ---- Manual signing -----------------------------------------------
      # -allowProvisioningUpdates hits an Apple-side cap on how much it will
      # create automatically, so the certificate and every profile are made by
      # hand (docs/APPLE_ACCOUNT_SETUP.md §3.1) and imported here.
      - name: Import the distribution certificate
        env:
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # A dedicated keychain, deleted in the cleanup step below, so the
          # private key never lingers on a runner or leaks into another job.
          KEYCHAIN="$RUNNER_TEMP/ajar-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"   # no auto-lock mid-build
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # `tr -d` first: a secret pasted from Windows/WSL tooling can arrive
          # CRLF-wrapped, and `base64 --decode` rejects embedded CRs outright
          # ("invalid input") — verified. GNU's -i would ignore them but means
          # "input file" to the BSD base64 on the macOS runner, so strip instead.
          printf '%s' "$P12" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f "$RUNNER_TEMP/dist.p12"
          # Without this, codesign blocks on a UI prompt that never comes and the
          # job hangs until the timeout rather than failing.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          found="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Apple Distribution" || true)"
          if [ "$found" -eq 0 ]; then
            echo "::error::No 'Apple Distribution' identity in the imported .p12."
            echo "The .p12 must bundle the certificate WITH its private key — see §3.1."
            exit 1
          fi
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Profiles are matched to targets by READING them, not by naming
      # convention: a profile named wrongly in the portal would otherwise sign
      # the wrong target and only surface as a confusing rejection at upload.
      - name: Install provisioning profiles and map them to targets
        env:
          PROFILE_APP: ${{ secrets.APPLE_PROFILE_APP }}
          PROFILE_DATA: ${{ secrets.APPLE_PROFILE_DATA }}
          PROFILE_CONTROL: ${{ secrets.APPLE_PROFILE_CONTROL }}
        run: |
          set -euo pipefail
          DEST=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$DEST"
          seen=""

          # A `case` rather than an associative array: macOS ships bash 3.2, which
          # has no `declare -A`, and this must not depend on which bash the runner
          # happens to resolve first.
          for var in PROFILE_APP PROFILE_DATA PROFILE_CONTROL; do
            eval "b64=\$$var"
            raw="$RUNNER_TEMP/$var.mobileprovision"
            printf '%s' "$b64" | tr -d '\r\n' | base64 --decode > "$raw"   # see note above
            # A .mobileprovision is CMS-signed; strip the signature to read the plist.
            plist="$RUNNER_TEMP/$var.plist"
            security cms -D -i "$raw" > "$plist"

            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
            # application-identifier is "<TEAMID>.<bundle id>" — drop the team prefix.
            appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")"
            bundle="${appid#*.}"

            case "$bundle" in
              family.ajar.child)                      target=AJAR_PROFILE_APP ;;
              family.ajar.child.FilterDataProvider)   target=AJAR_PROFILE_DATA ;;
              family.ajar.child.FilterControlProvider) target=AJAR_PROFILE_CONTROL ;;
              *)
                echo "::error::$var is a profile for '$bundle', which is not a target of this app."
                echo "Expected family.ajar.child, .FilterDataProvider or .FilterControlProvider."
                exit 1 ;;
            esac

            cp "$raw" "$DEST/$uuid.mobileprovision"
            echo "$target=$name" >> "$GITHUB_ENV"
            seen="$seen $target"
            echo "  $bundle -> '$name' ($uuid)"

            # Surface what the profile actually carries. A profile generated
            # before Family Controls was granted looks valid and then fails to
            # sign; seeing the keys here beats decoding it after the failure.
            echo "    entitlement keys:"
            /usr/libexec/PlistBuddy -c 'Print :Entitlements' "$plist" \
              | sed -n 's/^        \([a-zA-Z][a-zA-Z0-9.-]*\) =.*/      - \1/p' || true
            rm -f "$plist"
          done

          for want in AJAR_PROFILE_APP AJAR_PROFILE_DATA AJAR_PROFILE_CONTROL; do
            case "$seen" in
              *"$want"*) ;;
              *) echo "::error::No profile supplied for $want"; exit 1 ;;
            esac
          done

      # `github.run_number` is a per-workflow counter that knows nothing about
      # builds uploaded any other way, so the first CI run asked App Store
      # Connect to accept build `1` — which a manual Xcode upload had already
      # used — and the upload failed AFTER a full archive and export:
      #   ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE
      #   The bundle version must be higher than the previously uploaded version
      # Apple is the only source that cannot drift here, because it is the same
      # registry that rejects the duplicate.
      - name: Work out the next build number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: family.ajar.child
        run: |
          set -euo pipefail
          n="$(node .github/scripts/asc-next-build.mjs)"
          echo "next build number: $n"
          echo "BUILD_NUMBER=$n" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          # The archive runs through a shell function so the formatter can be
          # made optional WITHOUT repeating the invocation.
          #
          # It used to end `| xcbeautify || xcodebuild -version`. That reported a
          # FAILED ARCHIVE AS A PASSING STEP: `set -o pipefail` correctly fails
          # the pipeline, then `||` runs `xcodebuild -version`, which exits 0 and
          # becomes the step's exit code. The build then failed later, in Export,
          # as a confusing "archive not found". Verified: `set -o pipefail;
          # false | cat || echo hi` exits 0. Do not reintroduce the `||`.
          run_archive() {
            xcodebuild archive \
              -project ParentFilterPoC.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Ajar.xcarchive" \
              OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              AJAR_PROFILE_APP="$AJAR_PROFILE_APP" \
              AJAR_PROFILE_DATA="$AJAR_PROFILE_DATA" \
              AJAR_PROFILE_CONTROL="$AJAR_PROFILE_CONTROL" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          }
          if command -v xcbeautify >/dev/null 2>&1; then
            run_archive | xcbeautify
          else
            run_archive
          fi

      - name: Export the .ipa
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>family.ajar.child</key><string>${AJAR_PROFILE_APP}</string>
              <key>family.ajar.child.FilterDataProvider</key><string>${AJAR_PROFILE_DATA}</string>
              <key>family.ajar.child.FilterControlProvider</key><string>${AJAR_PROFILE_CONTROL}</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ajar.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          echo "uploading $(basename "$IPA")"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::Uploaded. Processing in App Store Connect takes a few minutes before it appears for internal testers."

      # Keep the archive: without dSYMs a TestFlight crash report is unreadable,
      # and this is a build whose on-device behaviour is the entire point.
      - name: Keep the archive and dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-${{ github.run_number }}
          path: ${{ runner.temp }}/Ajar.xcarchive
          retention-days: 14

      # The signing keychain holds the distribution PRIVATE KEY. Runners are
      # ephemeral, but `always()` means a failed build does not leave it behind
      # for whatever runs next on a self-hosted runner.
      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
            echo "signing keychain removed"
          fi
