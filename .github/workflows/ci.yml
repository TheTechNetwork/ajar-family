name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install (workspaces)
        run: npm ci

      - name: Build (shared → backend)
        run: npm run build

      - name: Test (shared + backend)
        run: npm test

      - name: Typecheck shared spec (strict)
        run: npx tsc -p shared/tsconfig.json --noEmit
