name: CI

on:
  # Every push to a branch WITH an open PR was running this twice — once for the
  # push, once for the pull_request — which is why two identical build-test runs
  # appeared per commit. main is the only branch that needs the push trigger;
  # everything else is covered by the PR.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

# A superseded CI check is waste, not a missed event: if two commits land close
# together only the newest needs a verdict. (deploy.yml deliberately does NOT
# cancel for the same reason inverted — a cancelled deploy is a thing that did
# not ship while reporting nothing wrong.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI reads the repo and nothing else. Without this block GITHUB_TOKEN inherits
# the repository default, which can be read-write on every scope; this was the
# one workflow here that had no permissions block at all.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install (workspaces)
        run: npm ci

      - name: Build (shared → backend)
        run: npm run build

      - name: Test (shared + backend)
        run: npm test

      - name: Typecheck shared spec (strict)
        run: npx tsc -p shared/tsconfig.json --noEmit

      # The Windows + macOS extensions hand-mirror the shared evaluator. Each
      # implementation's own tests can pass while the platforms silently disagree
      # about what is blocked, so run ONE corpus against all of them.
      - name: Conformance (shared spec vs. platform mirrors)
        run: npm run conformance

      # MV3/Safari pages cannot load CSS from outside their bundle and there is no
      # build step, so the design tokens are genuinely duplicated into four inline
      # copies. Duplication nothing checks is how a palette drifts back into a
      # contrast failure.
      - name: Design tokens are in sync across surfaces
        run: node web/parent/sync-tokens.mjs --check

      # sync-tokens only proves the four copies MATCH — it never checked that any
      # of them is readable. The ratios in tokens.css and docs/BRAND.md were
      # hand-written comments, and one was already wrong by 6x (a focus ring
      # documented at 15.91:1 whose load-bearing pair was 2.59:1). Recompute them.
      - name: Contrast ratios are computed, not claimed
        run: node web/parent/check-contrast.mjs

      # sync-tokens and check-contrast both stop at the web surfaces. The two
      # SwiftUI apps hold the palette again, in a syntax neither tool can read,
      # and they are the copies that reach a real device. Check them too.
      - name: Swift theme matches the canonical tokens
        run: node apple/check-theme-tokens.mjs

      # The OpenAPI document is the client contract; fail if the committed file
      # drifts from the one the code generates.
      - name: OpenAPI is in sync
        run: |
          npm run openapi --workspace @ajar/backend
          git diff --exit-code backend/openapi.json

  # The Windows service is Go, so `npm test` above never touches it. Until now it
  # was compiled ONLY by release.yml at tag time — meaning a broken build landed
  # on a branch silently and surfaced when cutting a release, which is the worst
  # moment to discover it. Cross-compile it here on every push instead.
  #
  # Every file in windows/agent is `//go:build windows`, so GOOS must be set even
  # to vet. Tests would need a windows runner to EXECUTE (cross-compiled test
  # binaries can't run on Linux); there are none yet, so this job proves the
  # agent compiles and vets, not that it behaves.
  windows-agent:
    runs-on: ubuntu-latest
    env:
      GOOS: windows
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: windows/agent/go.sum

      - name: gofmt
        working-directory: windows/agent
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: windows/agent
        run: go vet ./...

      # Both shipped arches, matching release.yml — an arm64-only break (rare but
      # real: syscall and registry surfaces differ) must not reach a tag.
      - name: Build (amd64 + arm64)
        working-directory: windows/agent
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "building windows/$arch"
            GOARCH=$arch go build -trimpath -ldflags "-s -w" -o /dev/null .
          done

  # WHY THIS EXISTS. Until now nothing in CI ever compiled the Swift. This repo
  # checks OpenAPI drift, cross-platform policy conformance, computed contrast
  # ratios and Go cross-compilation for two arches — and the two apps that reach
  # a child's phone got no pre-merge verification at all. An alpha-readiness
  # audit then found four defects in them, including a setup field that could not
  # type its own enrollment code and a parent inbox whose every poll threw on
  # decode. A build would not have caught those two. It would have caught the
  # class, and its absence is why nobody looked.
  #
  # Build only: no signing, no archive, no upload. Those need the Family Controls
  # distribution entitlement and live secrets, and they belong in testflight.yml.
  # This job answers one question — does it still compile — for free.
  apple-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 because the scope check below diffs against the base ref.
      # At the default depth 1 that commit is not in the local object store, the
      # check falls back to "build to be safe", and the 10x runner is spent on
      # every PR — the exact cost the check exists to avoid.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only spend the runner when something Apple actually changed. Done as a
      # step rather than a paths: filter so the job still reports a result on
      # every PR — a REQUIRED check that silently never runs is worse than one
      # that runs and says "nothing to do".
      - name: Does this change touch the Apple targets?
        id: scope
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base ref — building to be safe"
            echo "touched=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(apple/|\.github/workflows/ci\.yml)'; then
            echo "touched=yes" >> "$GITHUB_OUTPUT"
          else
            echo "nothing under apple/ changed"
            echo "touched=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Select an Xcode with the iOS 26 SDK or newer
        if: steps.scope.outputs.touched == 'yes'
        run: .github/scripts/select-xcode.sh

      - name: Install XcodeGen
        if: steps.scope.outputs.touched == 'yes'
        run: brew install xcodegen

      # Both apps, both generated from project.yml the same way a contributor
      # does it locally. CODE_SIGNING_ALLOWED=NO because signing needs the
      # restricted Family Controls entitlement, which is not granted yet and is
      # irrelevant to whether the code compiles.
      #
      # NO trailing `|| something` on these pipelines. `set -o pipefail` fails the
      # pipeline, then `||` runs a command that exits 0 and BECOMES the step's
      # exit code — testflight.yml shipped exactly that bug and reported a failed
      # archive as a passing step. Verified: `set -o pipefail; false | cat || echo hi`
      # exits 0.
      - name: Build AjarFilter (app + both NetworkExtension providers)
        if: steps.scope.outputs.touched == 'yes'
        working-directory: apple/AjarFilter
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build \
            -project AjarFilter.xcodeproj \
            -scheme AjarFilter \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Build AjarParent
        if: steps.scope.outputs.touched == 'yes'
        working-directory: apple/AjarParent
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build \
            -project AjarParent.xcodeproj \
            -scheme AjarParent \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # Release is a DIFFERENT compilation: #if DEBUG code is excluded, so a
      # release-only break is invisible to every step above. AjarFilter carries a
      # whole DEBUG-only harness file, which makes it exactly the target where
      # this can diverge.
      - name: Build AjarFilter in Release
        if: steps.scope.outputs.touched == 'yes'
        working-directory: apple/AjarFilter
        run: |
          set -euo pipefail
          xcodebuild build \
            -project AjarFilter.xcodeproj \
            -scheme AjarFilter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
